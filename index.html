<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VANT | فانت</title>
    <meta name="description" content="فانت VANT: أزياء مختارة بعناية، اطلب قطعتك بالمقاس الي يناسبك وتوصلك لباب البيت بكل العراق، والدفع عند الاستلام." />
    <!-- Link previews; bots opening a ?item= link get the piece's own card from api/product-preview -->
    <meta property="og:site_name" content="VANT فانت" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VANT | فانت" />
    <meta property="og:description" content="فانت VANT: أزياء مختارة بعناية، اطلب قطعتك بالمقاس الي يناسبك وتوصلك لباب البيت بكل العراق، والدفع عند الاستلام." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VANT | فانت" />
    <meta property="og:locale" content="ar_IQ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VANT | فانت" />
    <meta name="twitter:description" content="فانت VANT: أزياء مختارة بعناية، اطلب قطعتك بالمقاس الي يناسبك وتوصلك لباب البيت بكل العراق، والدفع عند الاستلام." />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="theme-color" content="#f8f9fa" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="فانت" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "VANT",
        "alternateName": "فانت",
        "description": "فانت VANT: أزياء مختارة بعناية، اطلب قطعتك بالمقاس الي يناسبك وتوصلك لباب البيت بكل العراق، والدفع عند الاستلام.",
        "image": "/og-image.png",
        "currenciesAccepted": "IQD",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IQ"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem('vant-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#0d0f12] text-[#15171c] dark:text-[#f3f4f6] antialiased selection:bg-[#004ad7]/20 selection:text-[#004ad7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
